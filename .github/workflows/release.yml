name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.MANGA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MANGA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          MANGA_KEYSTORE_PASSWORD: ${{ secrets.MANGA_KEYSTORE_PASSWORD }}
          MANGA_KEY_ALIAS: ${{ secrets.MANGA_KEY_ALIAS }}
          MANGA_KEY_PASSWORD: ${{ secrets.MANGA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Signing mode
        run: |
          if [ -z "$MANGA_KEYSTORE_FILE" ]; then
            echo "::warning::未配置 MANGA_KEYSTORE_BASE64，产物使用 debug 签名，仅供验证，不可发布"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mangareader-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
