name: Bug 报告
description: 应用崩溃、界面错误、下载/阅读异常（不涉及版权内容）
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请**不要**上传漫画截图、章节内容或站点抓包数据；需要时请用文字描述或脱敏日志。
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置 → 关于 中的版本号
      placeholder: "1.0.0 (100)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: "Pixel 7 / Android 15 / 1080x2400"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 阅读器（翻页/条漫/缩放）
        - 搜索与源
        - 书架/历史/收藏
        - 下载
        - 本地漫画
        - 备份/恢复
        - 设置/主题
        - 启动/崩溃
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 导入规则 …
        2. 搜索 …
        3. 打开第 N 话 …
        4. 出现 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志/错误码（可选，务必脱敏）
      description: 设置 → 隐私 → 导出诊断包 后的关键行；删除 URL query、Cookie、Token。
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue，未找到重复
          required: true
        - label: 我未在报告中包含版权内容或真实站点规则
          required: true
